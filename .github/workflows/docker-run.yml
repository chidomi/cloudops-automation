name: docker CloudOps Automation

on:

  workflow_dispatch:

jobs:
  run-docker-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: runner repo checkout  
        run: |
          echo "runner directory"
          pwd
          ls -lah

      - name: Build Docker image
        run: docker build -t cloudops-automation .

      - name: Run Docker container
        run: docker run --name cloudops-container cloudops-automation      
        
      - name: Copy report from container
        run: docker cp cloudops-container:/app/commit_report.txt ./commit_report.txt

      - name: Remove Docker container
        run: docker rm cloudops-container

      - name: Upload commit report
        uses: actions/upload-artifact@v7
        with:
          name: docker-commit-report-artifact
          path: .
